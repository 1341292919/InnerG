services:
  # Redis 服务，用于缓存、会话管理等，提供键值存储功能
  InnerG-redis:
    container_name: InnerG-redis
    image: redis:bookworm
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    env_file:
      - "./env/redis.env"
    networks:
      - InnerG

  # MySQL 服务，提供关系型数据库，用于存储结构化数据
  InnerG-mysql:
    container_name: InnerG-mysql
    image: mysql:9.0.1
    env_file:
      - "./env/mysql.env"
    ports:
      - "3306:3306"
    networks:
      - InnerG
    volumes:
      - ../config/sql:/docker-entrypoint-initdb.d
      - ./data/mysql:/var/lib/mysql
    # MongoDB 服务
  InnerG-mongodb:
    container_name: InnerG-mongodb
    image: mongodb/mongodb-community-server:latest
    ports:
      - "27017:27017"  # MongoDB 默认端口
    volumes:
      - ./data/mongodb:/data/db
      - ../config/mongodb:/docker-entrypoint-initdb.d
    env_file:
      - "./env/mongodb.env"
    networks:
      - InnerG
    restart: unless-stopped

  InnerG-prometheus:
    image: prom/prometheus
    container_name: InnerG-prometheus
    hostname: prometheus
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - InnerG

  # Grafana 服务，可视化和分析平台，展示 Prometheus 等数据源的指标数据
  InnerG-grafana:
    container_name: InnerG-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - InnerG

  # RabbitMQ 消息队列服务，带管理界面
  InnerG-rabbitmq:
    container_name: InnerG-rabbitmq
    image: rabbitmq:4.0-management-alpine
    ports:
      - "5672:5672"   # AMQP 协议端口（应用连接用）
      - "15672:15672" # Web 管理界面端口
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    env_file:
      - "./env/rabbitmq.env"
    networks:
      - InnerG

  InnerG_server:
    container_name: InnerG_server
    image: innerg:1.0
    ports:
      - "20000:20000"  # 仅向外暴露应用服务的端口
    networks:
      - InnerG
    volumes:
      - ../config/:/app/config/
      - ./logs:/app/logs        # 挂载日志目录
    depends_on:
      - InnerG-redis
      - InnerG-mysql
      - InnerG-mongodb
      - InnerG-grafana
      - InnerG-prometheus
      - InnerG-rabbitmq
    restart: unless-stopped

networks:
  InnerG:
    driver: bridge
    name: InnerG